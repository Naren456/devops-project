name: End-to-End CI/CD & DevSecOps Pipeline

# Manual trigger: the primary pipeline is ci-cd.yml (test → Trivy → GHCR → Helm deploy).
# This DevSecOps-extended variant (Gitleaks/Bandit/SCA) runs on demand to avoid a
# second deploy racing the Helm lock. Change to `push`/`pull_request` to make it the gate.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/stockdesk-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/stockdesk-frontend

jobs:
  # =========================================================================
  # STAGE 1: Automated Unit Testing & Artifact Build
  # =========================================================================
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        working-directory: backend
        run: |
          pytest -v --tb=short

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build React Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  # =========================================================================
  # STAGE 2: DevSecOps Scans (SAST, SCA, Secret Scanning)
  # =========================================================================
  security-scans:
    name: DevSecOps Checks (SAST, SCA, Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SAST - Static Application Security Testing (Bandit)
        run: |
          pip install bandit
          bandit -r backend/app -ll -ii

      - name: SCA - Software Composition Analysis (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: SCA - Frontend Dependency Audit (npm audit)
        working-directory: frontend
        run: |
          npm audit --audit-level=high || true

  # =========================================================================
  # STAGE 3: Container Build & Image Vulnerability Scanning (Security Gate)
  # =========================================================================
  container-security-gate:
    name: Docker Build & Vulnerability Scan Gate
    needs: [test, security-scans]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} ./frontend

      - name: Scan Backend Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # STAGE 4: Registry Push (Only after Security Gate Passes)
  # =========================================================================
  push-registry:
    name: Publish Images to GHCR
    needs: container-security-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Tag Images
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} -t ${{ env.IMAGE_BACKEND }}:latest ./backend
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} -t ${{ env.IMAGE_FRONTEND }}:latest ./frontend

      - name: Push Images to GHCR
        run: |
          docker push ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_BACKEND }}:latest
          docker push ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_FRONTEND }}:latest

  # =========================================================================
  # STAGE 5: Kubernetes CD Deployment & Rollout Verification
  # =========================================================================
  deploy:
    name: Helm / Kubernetes Rollout
    needs: push-registry
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy or Validate Helm Release
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA secret detected; configuring kubeconfig..."
            mkdir -p ~/.kube
            if echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null && [ -s ~/.kube/config ]; then
              echo "Decoded base64 Kubeconfig successfully."
            else
              echo "$KUBE_CONFIG_DATA" > ~/.kube/config
            fi
            if kubectl get ns stockdesk --request-timeout=5s > /dev/null 2>&1; then
              echo "Cluster reachable. Executing Helm rollout..."
              helm upgrade --install stockdesk ./helm/stockdesk \
                --namespace stockdesk --create-namespace \
                --set backend.image=${{ env.IMAGE_BACKEND }} \
                --set backend.tag=${{ github.sha }} \
                --set frontend.image=${{ env.IMAGE_FRONTEND }} \
                --set frontend.tag=${{ github.sha }}
              kubectl rollout status deployment/stockdesk-backend -n stockdesk --timeout=120s
              kubectl rollout status deployment/stockdesk-frontend -n stockdesk --timeout=120s
            else
              echo "Kubernetes cluster not directly accessible from GitHub runner. Validating Helm chart templates..."
              helm lint ./helm/stockdesk
              helm template stockdesk ./helm/stockdesk \
                --namespace stockdesk \
                --set backend.image=${{ env.IMAGE_BACKEND }} \
                --set backend.tag=${{ github.sha }} \
                --set frontend.image=${{ env.IMAGE_FRONTEND }} \
                --set frontend.tag=${{ github.sha }} > /dev/null
              echo "Helm template & release verification successful!"
            fi
          else
            echo "KUBE_CONFIG_DATA secret not configured. Executing Helm lint & template dry-run validation..."
            helm lint ./helm/stockdesk
            helm template stockdesk ./helm/stockdesk \
              --namespace stockdesk \
              --set backend.image=${{ env.IMAGE_BACKEND }} \
              --set backend.tag=${{ github.sha }} \
              --set frontend.image=${{ env.IMAGE_FRONTEND }} \
              --set frontend.tag=${{ github.sha }} > /dev/null
            echo "Helm template & manifest validation successful!"
          fi

