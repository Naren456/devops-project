apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockdesk-capstone
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockdesk-project
  source:
    repoURL: https://github.com/Naren456/devops-project.git
    targetRevision: HEAD
    path: helm/stockdesk
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        # CI publishes images tagged by Git SHA (never :latest), so pin a real tag.
        - name: backend.tag
          value: "50840d2176b2d58bc8dcb35412fe390eb94a15ae"
        - name: frontend.tag
          value: "50840d2176b2d58bc8dcb35412fe390eb94a15ae"
  destination:
    server: https://kubernetes.default.svc
    namespace: stockdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
