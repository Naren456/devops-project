apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: stockdesk-project
  namespace: argocd
spec:
  description: "GitOps project for StockDesk Application"
  sourceRepos:
    - "*"
  destinations:
    - namespace: stockdesk
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
