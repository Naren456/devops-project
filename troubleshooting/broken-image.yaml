apiVersion: apps/v1
kind: Deployment
metadata: {name: stockdesk-broken-image, namespace: stockdesk}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: backend, image: ghcr.io/example/stockdesk-backend:does-not-exist}]
