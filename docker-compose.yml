services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockdesk
      POSTGRES_USER: stockdesk
      POSTGRES_PASSWORD: stockdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockdesk -d stockdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://stockdesk:stockdesk@postgres:5432/stockdesk
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      default:
        aliases:
          - stockdesk-backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: on-failure
    ports:
      - "3000:8080"

volumes:
  postgres-data:
