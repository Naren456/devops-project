{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: stockdesk}
spec:
  ingressClassName: nginx
  rules:
  - {{- with .Values.ingress.host }}
    host: {{ . }}
    {{- end }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: stockdesk-backend, port: {number: 8000}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: stockdesk-frontend, port: {number: 80}}}}
{{- end }}
