{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stockdesk.fullname" . }}-backend
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app: stockdesk-backend}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
