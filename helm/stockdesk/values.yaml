frontend:
  image: ghcr.io/naren456/stockdesk-frontend
  tag: latest
backend:
  image: ghcr.io/naren456/stockdesk-backend
  tag: latest
replicaCount: 2
namespace: stockdesk
imagePullSecrets: []
postgres:
  host: stockdesk-postgres
  database: stockdesk
  username: stockdesk
  password: stockdesk
  storage: 5Gi
  storageClassName: ""   # empty = cluster default (gp3 on EKS via k8s/storageclass-gp3.yaml)
ingress:
  enabled: false
  host: stockdesk.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
